<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backend Engineer at Acme Fintech (sample Greenhouse-style form)</title>
<style>
  body{font:15px/1.5 Arial,sans-serif;max-width:720px;margin:0 auto;padding:24px;color:#222;background:#fff}
  h1{font-size:26px;margin:0}.co{color:#666;margin-bottom:20px}
  .field{margin:14px 0}label{display:block;font-weight:bold;margin-bottom:4px}
  input[type=text],input[type=email],input[type=tel],select,textarea{width:100%;padding:8px;border:1px solid #bbb;border-radius:4px;font:inherit;box-sizing:border-box}
  .asterisk{color:#c00}h2{font-size:18px;border-top:1px solid #ddd;padding-top:16px;margin-top:28px}
  #submit_app{background:#2e7d32;color:#fff;border:0;padding:12px 24px;font-size:16px;border-radius:4px;margin-top:20px}
  .eeoc{background:#f6f6f6;padding:12px;border-radius:6px}
</style>
</head>
<body>
<h1>Backend Engineer</h1>
<div class="co">at Acme Fintech · London, UK (sample form for testing)</div>
<form id="application_form" action="/never" method="post">
  <div class="field"><label for="first_name">First Name <span class="asterisk">*</span></label><input type="text" id="first_name" name="job_application[first_name]" autocomplete="given-name"></div>
  <div class="field"><label for="last_name">Last Name <span class="asterisk">*</span></label><input type="text" id="last_name" name="job_application[last_name]" autocomplete="family-name"></div>
  <div class="field"><label for="email">Email <span class="asterisk">*</span></label><input type="email" id="email" name="job_application[email]"></div>
  <div class="field"><label for="phone">Phone</label><input type="tel" id="phone" name="job_application[phone]"></div>
  <div class="field"><label for="location">Location (City)</label><input type="text" id="location" name="job_application[location]"></div>
  <div class="field"><label for="resume">Resume/CV <span class="asterisk">*</span></label><input type="file" id="resume" name="job_application[resume]" accept=".pdf,.doc,.docx"></div>
  <div class="field"><label for="cover_letter">Cover Letter</label><input type="file" id="cover_letter" name="job_application[cover_letter]"></div>

  <h2>Questions</h2>
  <div class="field"><label for="q_linkedin">LinkedIn Profile</label><input type="text" id="q_linkedin" name="job_application[answers_attributes][0][text_value]"></div>
  <div class="field"><label for="q_website">Website</label><input type="text" id="q_website" name="job_application[answers_attributes][1][text_value]"></div>
  <div class="field"><label for="q_rtw">Are you legally authorised to work in the United Kingdom? <span class="asterisk">*</span></label>
    <select id="q_rtw" name="job_application[answers_attributes][2][boolean_value]"><option value="">--</option><option value="1">Yes</option><option value="0">No</option></select></div>
  <div class="field"><label for="q_sponsor">Will you now or in the future require visa sponsorship? <span class="asterisk">*</span></label>
    <select id="q_sponsor" name="job_application[answers_attributes][3][boolean_value]"><option value="">--</option><option value="1">Yes</option><option value="0">No</option></select></div>
  <div class="field"><label for="q_notice">What is your notice period?</label><input type="text" id="q_notice" name="job_application[answers_attributes][4][text_value]"></div>
  <div class="field"><label for="q_hear">How did you hear about this job? <span class="asterisk">*</span></label><input type="text" id="q_hear" name="job_application[answers_attributes][5][text_value]"></div>
  <div class="field"><label><input type="checkbox" id="q_privacy" name="job_application[data_compliance][gdpr_consent_given]"> I have read the candidate privacy notice</label></div>

  <h2>Voluntary Self-Identification</h2>
  <div class="eeoc">
    <div class="field"><label for="gender">Gender</label><select id="gender" name="job_application[gender]"><option value="">Please select</option><option>Male</option><option>Female</option><option>Decline to self identify</option></select></div>
    <div class="field"><label for="hispanic">Are you Hispanic/Latino?</label><select id="hispanic" name="job_application[hispanic_ethnicity]"><option value="">Please select</option><option>Yes</option><option>No</option><option>Decline to self identify</option></select></div>
    <div class="field"><label for="race">Race</label><select id="race" name="job_application[race]"><option value="">Please select</option><option>White</option><option>Asian</option><option>Decline to self identify</option></select></div>
    <div class="field"><label for="veteran">Veteran Status</label><select id="veteran" name="job_application[veteran_status]"><option value="">Please select</option><option>I am not a protected veteran</option><option>I don't wish to answer</option></select></div>
    <div class="field"><label for="disability">Disability Status</label><select id="disability" name="job_application[disability_status]"><option value="">Please select</option><option>Yes, I have a disability</option><option>No, I don't have a disability</option><option>I don't wish to answer</option></select></div>
  </div>

  <button type="submit" id="submit_app">Submit Application</button>
</form>
<script>
  // Counts any attempt to submit, so the test can prove the extension never submits.
  window.submitAttempts = 0;
  document.getElementById("application_form").addEventListener("submit", (e) => { e.preventDefault(); window.submitAttempts++; document.title = "SUBMITTED"; });
  document.getElementById("submit_app").addEventListener("click", () => { window.submitClicks = (window.submitClicks || 0) + 1; });
</script>
</body>
</html>
